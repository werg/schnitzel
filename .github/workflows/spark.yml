name: Manual Spark validation
# Never execute untrusted PR code on a persistent GPU runner.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spark:
    runs-on: [self-hosted, linux, ARM64, spark]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/spark.sh build
      - run: ./scripts/spark.sh run schnitz doctor --require-spark
      - run: ./scripts/spark.sh run python -m pytest -q
      - run: ./scripts/start_spark.sh --recipe recipes/looped_smoke.yaml --output runs/manual-looped-${{ github.run_id }}
