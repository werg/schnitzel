[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schnitz"
version = "0.4.0"
description = "Stigmergic Compactable Holographic Neural Indexed Trajectory Zettelkasten with Evolving Latents, Jointly Adapted by Gated Decoders"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=1.26", "safetensors>=0.5", "PyYAML>=6"]

[project.optional-dependencies]
hf = ["transformers==5.17.0"]
data = ["datasets==5.0.1"]
tracking = ["wandb>=0.19,<1"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
schnitz = "schnitz.cli:main"
sdkb = "schnitz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Retire successful checkpoint fixtures; retain one failed session for debugging.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = ["integration: requires optional Transformers, model downloads, or accelerator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
