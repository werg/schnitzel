# R5b: error-driven key and writer learning against the full R4 bank
# (record_gradients.py). Warm-starts from R5a. Candidate keys are the direct heads
# applied to cached writer key-slot states, so every retrieved record gives the
# heads exact gradients and the whole index is recomputed after every step.
# Per-record key-state and payload cotangents accumulate with per-step decay; the
# writer backward runs for a close neighbourhood of each step's reads (a quarter of
# each read limit, plus gold) and the largest accumulated gradients elsewhere. A
# forward-only rolling refresh re-encodes the stalest records. Learning rates are
# the R5 values (owner preference: no lowering). Launch with --train-recurrent-core
# and --key-states <bank>/key-states-<writer>.safetensors.
